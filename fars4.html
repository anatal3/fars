<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش استاندارد الفبای فارسی - منطبق با کتاب فارسی اول دبستان ایران</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #e8f5e9;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* هدر */
        header {
            background-color: #1b5e20; color: white;
            padding: 8px 18px; display: flex;
            justify-content: space-between; align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        h1 { margin: 0; font-size: 1.2rem; }
        .header-btns { display: flex; gap: 8px; }
        .top-btn {
            background-color: #ffca28; color: #000;
            border: none; padding: 6px 12px; font-size: 0.9rem;
            font-family: inherit; font-weight: bold;
            border-radius: 8px; cursor: pointer;
        }
        .top-btn:hover { background-color: #ffc107; }

        /* نوار حروف الفبا */
        .alphabet-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 5px; padding: 7px 10px;
            background-color: #c8e6c9;
            border-bottom: 3px solid #81c784;
            max-height: 120px; overflow-y: auto;
        }
        .char-btn {
            background-color: white; border: 2px solid #2e7d32;
            color: #1b5e20; font-size: 1.15rem; font-weight: bold;
            min-width: 42px; height: 42px; padding: 0 6px; border-radius: 10px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.15s; box-shadow: 0 3px 0 #2e7d32;
        }
        .char-btn:hover, .char-btn.active {
            background-color: #2e7d32; color: white;
            transform: translateY(2px); box-shadow: 0 1px 0 #1b5e20;
        }

        /* محیط کار و دفتر مشق */
        .workspace {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 6px 18px; position: relative;
        }

        .forms-bar {
            display: flex; gap: 10px; margin-bottom: 6px; z-index: 10; flex-wrap: wrap; justify-content: center;
        }
        .form-btn {
            background-color: #fff; border: 3px solid #0277bd;
            color: #01579b; font-size: 1.25rem; font-weight: bold;
            padding: 3px 18px; border-radius: 15px; cursor: pointer;
            box-shadow: 0 4px 0 #0277bd; font-family: inherit;
        }
        .form-btn.active {
            background-color: #0277bd; color: white;
            transform: translateY(2px); box-shadow: 0 2px 0 #01579b;
        }

        .notebook {
            background-color: #fff; width: 96%; flex-grow: 1;
            border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            position: relative; display: flex; justify-content: center; align-items: center;
            border: 4px solid #fb8c00; overflow: hidden;
        }

        svg { width: 100%; height: 100%; max-width: 860px; max-height: 450px; }

        /* خطوط استاندارد دفتر مشق داخل SVG */
        .ruled-line { stroke: #bbdefb; stroke-width: 2.5; }
        .half-line { stroke: #cfd8dc; stroke-width: 2; stroke-dasharray: 8, 8; }
        .baseline { stroke: #d32f2f; stroke-width: 4.5; }
        .line-label { fill: #90a4ae; font-size: 11px; font-family: 'Vazirmatn', Tahoma; }
        .guide-box { stroke: #9e9e9e; stroke-width: 2.5; stroke-dasharray: 6,6; fill: none; }
        
        /* ضخامت استاندارد قلم تحریری (15px) برای وضوح کامل حلقه‌ها و دندانه‌ها */
        .ghost-path {
            fill: none; stroke: #e4e7eb; stroke-width: 15;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .draw-path {
            fill: none; stroke: #1565c0; stroke-width: 15;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .draw-path.secondary { stroke: #2e7d32; }
        .draw-path.thin-sign { stroke-width: 11; stroke: #2e7d32; }
        .draw-path.dot-stroke { stroke-width: 19; stroke: #2e7d32; }

        /* نقطه شروع و فلش جهت حرکت دست */
        .start-point {
            fill: #ff1744;
            animation: pulse 1.1s infinite;
        }
        @keyframes pulse {
            0% { r: 6px; opacity: 1; }
            50% { r: 11px; opacity: 0.45; }
            100% { r: 6px; opacity: 1; }
        }

        /* کادر نمایش فونت چاپی مرجع در گوشه دفتر */
        .ref-card {
            position: absolute; top: 12px; left: 18px;
            width: 105px; height: 105px;
            background: #fffde7; border: 3px solid #fbc02d;
            border-radius: 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .ref-card-title {
            font-size: 0.72rem; color: #795548; font-weight: bold;
            position: absolute; top: 4px;
        }
        .ref-char-box {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .ref-line {
            position: absolute; bottom: 32px; width: 78%;
            height: 3px; background-color: #e53935;
        }
        .ref-char {
            font-family: 'B Koodak', 'Koodak', 'Vazirmatn', Tahoma, sans-serif;
            font-size: 3.1rem; font-weight: bold; color: #37474f;
            z-index: 2; line-height: 1; margin-top: 6px;
        }

        /* پیام راهنما */
        .status-badge {
            position: absolute; top: 12px; right: 18px;
            font-size: 1.25rem; font-weight: bold; color: #263238;
            background: rgba(255,255,255,0.94); padding: 5px 14px;
            border-radius: 12px; border: 2px dashed #90a4ae;
        }

        /* دکمه‌های کنترل پایین */
        .controls {
            padding: 9px; display: flex; justify-content: center;
            gap: 14px; background-color: #c8e6c9; width: 100%;
        }
        .ctrl-btn {
            padding: 9px 22px; font-size: 1.2rem; font-family: inherit;
            font-weight: bold; border: none; border-radius: 12px;
            cursor: pointer; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.25);
            display: flex; align-items: center; gap: 8px;
        }
        .ctrl-btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-play { background-color: #2e7d32; }
        .btn-step { background-color: #ef6c00; }
        .btn-reset { background-color: #c62828; }
    </style>
</head>
<body>

    <header>
        <h1>✏️ آموزش استاندارد الفبا (منطبق با کتاب فارسی و نگارش اول دبستان ایران)</h1>
        <div class="header-btns">
            <button class="top-btn" onclick="toggleGuides()" id="guideBtn">📏 خط نیم‌خط: روشن</button>
            <button class="top-btn" onclick="toggleSpeed()" id="speedBtn">🐢 سرعت: معمولی</button>
            <button class="top-btn" onclick="toggleFullScreen()">📺 تمام صفحه</button>
        </div>
    </header>

    <div class="alphabet-grid" id="alphabetGrid"></div>

    <div class="workspace">
        <div class="forms-bar" id="formsBar"></div>

        <div class="notebook">
            <div class="status-badge" id="statusText">یک حرف را انتخاب کنید</div>
            
            <!-- کادر مرجع چاپی در گوشه چپ -->
            <div class="ref-card" title="شکل در کتاب درسی">
                <span class="ref-card-title">شکل در کتاب</span>
                <div class="ref-char-box">
                    <div class="ref-line"></div>
                    <span class="ref-char" id="refCharDisplay">آ</span>
                </div>
            </div>

            <svg viewBox="0 0 600 400" id="svgCanvas">
                <defs>
                    <marker id="dirArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#e53935" />
                    </marker>
                </defs>

                <!-- خطوط واقعی دفتر مشق (کالیبره شده با ابعاد حروف) -->
                <!-- ۱. خط آبی بالای دفتر (سقف حروف بلند: آ، ا، ک، گ، ل، ط) -->
                <line x1="40" y1="115" x2="560" y2="115" class="ruled-line" />
                <text x="555" y="110" class="line-label">خط بالا</text>

                <!-- ۲. خط‌چین راهنمای نیم‌خط (سقف دندانه‌ها، د، ر، و، ف، ق، هـ) -->
                <g id="halfLineGroup">
                    <line x1="40" y1="178" x2="560" y2="178" class="half-line" />
                    <text x="555" y="173" class="line-label">نیم‌خط</text>
                </g>

                <!-- ۳. خط زمینه اصلی (قرمز) -->
                <line x1="40" y1="240" x2="560" y2="240" class="baseline" />
                <text x="555" y="234" class="line-label" style="fill:#d32f2f; font-weight:bold;">خط زمینه</text>

                <!-- ۴. خط آبی پایین دفتر (حد کاسه‌ها و دنباله حروف زیر خط) -->
                <line x1="40" y1="350" x2="560" y2="350" class="ruled-line" />
                <text x="555" y="345" class="line-label">خط پایین</text>
                
                <!-- کادر نقطه‌چین مخصوص نشانه‌ها (ـَ ـِ ـُ ـّ ـً) -->
                <rect id="vowelBox" x="268" y="168" width="64" height="72" rx="8" class="guide-box" style="display:none;" />

                <g id="ghostGroup"></g>
                <g id="drawGroup"></g>
                
                <!-- فلش جهت حرکت دست -->
                <line id="startArrow" x1="0" y1="0" x2="0" y2="0" stroke="#e53935" stroke-width="3.5" marker-end="url(#dirArrow)" style="display:none;" />
                <!-- نقطه شروع -->
                <circle id="startDot" cx="0" cy="0" r="8" class="start-point" style="display:none;" />

                <!-- مداد متحرک -->
                <g id="pencil" style="display:none;">
                    <polygon points="0,0 14,-38 32,-18" fill="rgba(0,0,0,0.14)" transform="translate(4, 4)" />
                    <polygon points="0,0 5,-13 13,-5" fill="#212121" />
                    <polygon points="5,-13 15,-36 36,-15 13,-5" fill="#ffe0b2" />
                    <polygon points="15,-36 55,-76 76,-55 36,-15" fill="#e53935" />
                    <polygon points="55,-76 64,-85 85,-64 76,-55" fill="#f48fb1" />
                </g>
            </svg>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn btn-play" onclick="playAll()">▶️ نوشتن کامل</button>
        <button class="ctrl-btn btn-step" onclick="playNextStep()">👣 گام به گام (با معلم)</button>
        <button class="ctrl-btn btn-reset" onclick="resetCanvas()">🔄 پاک کردن</button>
    </div>

<script>
/**
 * مهندسی دقیق حروف بر اساس شبکه خطوط دفتر مشق:
 * خط بالا: Y = 115 | نیم‌خط: Y = 178 | خط زمینه: Y = 240 | خط پایین: Y = 350
 */

const dot = (x, y) => ({ path: `M ${x} ${y} l 0.1 0`, isDot: true, dur: 350 });
const twoDots = (x, y) => [ dot(x + 14, y), dot(x - 14, y) ];
const threeDotsUp = (x, y) => [ dot(x + 14, y), dot(x - 14, y), dot(x, y - 20) ];
const threeDotsDown = (x, y) => [ dot(x + 14, y), dot(x - 14, y), dot(x, y + 20) ];

// علامت همزه کوچک (ء) در بالای الف، واو، دندانه ئـ و هٔ
const hamzaSign = (x, y) => ({
    path: `M ${x+6} ${y-14} C ${x-10} ${y-16}, ${x-10} ${y-2}, ${x+8} ${y-3} L ${x-10} ${y+8}`,
    thin: true, dur: 900
});

// ۱. خانواده ب، پ، ت، ث (شروع دندانه دقیقاً از نیم‌خط Y=180)
const B_INIT = { path: "M 355 182 L 352 222 Q 350 240, 330 240 L 220 240", dur: 1200 };
const B_FINAL = { path: "M 410 185 L 407 222 Q 405 240, 382 240 L 220 240 Q 195 240, 198 190", dur: 1700 };

// ۲. خانواده ج، چ، ح، خ (کاملاً منطبق با فونت کتاب درسی: ابروی بالایی + شکست در رأس راست + ساقه مورب یا شکم گرد زیر خط)
const JIM_INIT = { path: "M 265 190 Q 305 175, 348 190 L 275 240 L 205 240", dur: 1600 };
const JIM_FINAL = { path: "M 265 182 Q 305 168, 346 182 L 282 222 C 235 252, 235 332, 300 335 C 325 336, 345 330, 358 320", dur: 2100 };

// ۳. خانواده د، ذ (شروع از نیم‌خط Y=176، قوس پشت و نشستن روی خط زمینه + نقطه ذ دقیقاً بالای سر دال)
const DAL_BODY = { path: "M 302 176 C 328 190, 342 208, 342 224 Q 342 240, 324 240 L 262 240", dur: 1400 };

// ۴. خانواده ر، ز، ژ (شروع از نیم‌خط Y=178، تماس با خط زمینه و سر خوردن تا بالای خط پایین)
const RE_BODY = { path: "M 332 178 C 335 205, 334 230, 325 248 C 312 275, 282 302, 245 312", dur: 1400 };

// ۵. خانواده س، ش (دندانه‌ها از نیم‌خط تا خط زمینه + کاسه استاندارد زیر خط زمینه تا Y=325)
const SIN_INIT = [
    { path: "M 405 192 L 405 224 Q 405 240, 384 240 Q 363 240, 363 198", dur: 750 },
    { path: "M 363 198 L 363 224 Q 363 240, 338 240 Q 313 240, 313 198", dur: 750 },
    { path: "M 313 198 L 313 224 Q 313 240, 290 240 L 205 240", dur: 900 }
];
const SIN_FINAL = [
    { path: "M 425 192 L 425 224 Q 425 240, 404 240 Q 383 240, 383 198", dur: 750 },
    { path: "M 383 198 L 383 224 Q 383 240, 358 240 Q 333 240, 333 198", dur: 750 },
    { path: "M 333 198 L 333 248 C 333 328, 205 328, 205 248 Q 205 230, 210 212", dur: 1600 }
];

// ۶. خانواده ص، ض
const SAD_INIT = [
    { path: "M 315 240 C 335 182, 420 182, 420 222 C 420 240, 385 240, 315 240", dur: 1400 },
    { path: "M 315 240 Q 285 240, 285 202 L 285 224 Q 285 240, 262 240 L 195 240", dur: 1100 }
];
const SAD_FINAL = [
    { path: "M 330 240 C 350 182, 435 182, 435 222 C 435 240, 400 240, 330 240", dur: 1400 },
    { path: "M 330 240 Q 312 240, 312 202 L 312 248 C 312 328, 190 328, 190 248 Q 190 230, 196 212", dur: 1600 }
];

// ۷. خانواده ط، ظ (فرود دسته ط از خط بالا Y=118 روی گره حلقه)
const TA_BODY = [
    { path: "M 315 240 C 335 182, 420 182, 420 222 C 420 240, 385 240, 215 240", dur: 1600 },
    { path: "M 318 118 L 318 238", dur: 1000 }
];

// ۸. خانواده ع، غ
const AYN_INIT = { path: "M 332 172 C 282 156, 278 214, 345 214 C 322 234, 298 240, 265 240 L 200 240", dur: 1800 };
const AYN_MED  = { path: "M 405 240 L 335 240 Q 320 240, 312 225 L 290 184 C 282 158, 358 158, 350 184 L 325 228 Q 318 240, 298 240 L 195 240", dur: 2000 };
const AYN_FIN_CONN = { path: "M 405 240 L 335 240 Q 320 240, 312 225 L 290 184 C 282 158, 358 158, 350 184 L 320 230 C 250 265, 245 348, 355 335", dur: 2200 };
const AYN_ISO  = { path: "M 332 168 C 282 152, 278 210, 345 210 C 250 248, 240 348, 355 335", dur: 2000 };

// ۹. خانواده ف، ق (تنظیم دقیق حلقه زیر نیم‌خط Y=175، و کاسه ق آخر زیر خط زمینه با برگشت دقیق تا خط زمینه Y=240)
const FE_INIT_BODY = { path: "M 355 212 C 318 212, 318 174, 346 174 C 370 174, 370 200, 358 216 Q 352 240, 330 240 L 210 240", dur: 1800 };
const FE_FINAL_BODY = { path: "M 390 212 C 353 212, 353 174, 381 174 C 405 174, 405 200, 393 216 Q 387 240, 365 240 L 220 240 Q 195 240, 198 190", dur: 2000 };
const QAF_FINAL_BODY = { path: "M 365 212 C 328 212, 328 174, 356 174 C 380 174, 380 200, 368 216 L 365 248 C 362 325, 225 325, 225 248 Q 225 232, 230 218", dur: 2200 };

// ۱۰. خانواده ک، گ (ستون از خط بالا Y=135 تا خط زمینه + اتصال سرکش)
const KAF_INIT_BODY = { path: "M 350 135 L 350 222 Q 350 240, 330 240 L 215 240", dur: 1300 };
const KAF_INIT_SARKESH = { path: "M 408 96 L 350 135", dur: 750 };
const GAF_INIT_LINE2 = { path: "M 400 66 L 348 101", dur: 650 };

const KAF_FINAL_BODY = { path: "M 385 135 L 385 222 Q 385 240, 365 240 L 215 240 Q 192 240, 196 190", dur: 1600 };
const KAF_FINAL_SARKESH = { path: "M 443 96 L 385 135", dur: 750 };
const GAF_FINAL_LINE2 = { path: "M 435 66 L 383 101", dur: 650 };

// بانک جامع حروف و نشانه‌های کتاب فارسی اول دبستان ایران
const ALPHABET = {
    'آ / ا': {
        'آ (اول)': { ref: 'آ', strokes: [
            { path: "M 300 128 L 300 240", dur: 1200 },
            { path: "M 340 96 C 324 110, 312 106, 300 96 C 288 86, 276 82, 260 96", sec: true, dur: 1000 }
        ]},
        'ا (تنها)': { ref: 'ا', strokes: [ { path: "M 300 118 L 300 240", dur: 1200 } ]},
        'ـا (چسبان)': { ref: 'ـا', strokes: [ { path: "M 365 240 L 308 240 Q 292 240, 292 224 L 292 118", dur: 1500 } ]}
    },
    'ب': {
        'بـ (غیرآخر)': { ref: 'بـ', strokes: [ B_INIT, dot(290, 275) ]},
        'ب (آخر)': { ref: 'ب', strokes: [ B_FINAL, dot(300, 275) ]}
    },
    'پ': {
        'پـ (غیرآخر)': { ref: 'پـ', strokes: [ B_INIT, ...threeDotsDown(290, 272) ]},
        'پ (آخر)': { ref: 'پ', strokes: [ B_FINAL, ...threeDotsDown(300, 272) ]}
    },
    'ت': {
        'تـ (غیرآخر)': { ref: 'تـ', strokes: [ B_INIT, ...twoDots(290, 152) ]},
        'ت (آخر)': { ref: 'ت', strokes: [ B_FINAL, ...twoDots(300, 152) ]}
    },
    'ث': {
        'ثـ (غیرآخر)': { ref: 'ثـ', strokes: [ B_INIT, ...threeDotsUp(290, 155) ]},
        'ث (آخر)': { ref: 'ث', strokes: [ B_FINAL, ...threeDotsUp(300, 155) ]}
    },
    'ج': {
        'جـ (غیرآخر)': { ref: 'جـ', strokes: [ JIM_INIT, dot(305, 272) ]},
        'ج (آخر)': { ref: 'ج', strokes: [ JIM_FINAL, dot(295, 280) ]}
    },
    'چ': {
        'چـ (غیرآخر)': { ref: 'چـ', strokes: [ JIM_INIT, ...threeDotsDown(305, 268) ]},
        'چ (آخر)': { ref: 'چ', strokes: [ JIM_FINAL, ...threeDotsDown(295, 272) ]}
    },
    'ح': {
        'حـ (غیرآخر)': { ref: 'حـ', strokes: [ JIM_INIT ]},
        'ح (آخر)': { ref: 'ح', strokes: [ JIM_FINAL ]}
    },
    'خ': {
        'خـ (غیرآخر)': { ref: 'خـ', strokes: [ JIM_INIT, dot(308, 150) ]},
        'خ (آخر)': { ref: 'خ', strokes: [ JIM_FINAL, dot(305, 142) ]}
    },
    'د': { 'د': { ref: 'د', strokes: [ DAL_BODY ] } },
    'ذ': { 'ذ': { ref: 'ذ', strokes: [ DAL_BODY, dot(308, 145) ] } },
    'ر': { 'ر': { ref: 'ر', strokes: [ RE_BODY ] } },
    'ز': { 'ز': { ref: 'ز', strokes: [ RE_BODY, dot(328, 146) ] } },
    'ژ': { 'ژ': { ref: 'ژ', strokes: [ RE_BODY, ...threeDotsUp(328, 148) ] } },
    'س': {
        'سـ (غیرآخر)': { ref: 'سـ', strokes: SIN_INIT },
        'س (آخر)': { ref: 'س', strokes: SIN_FINAL }
    },
    'ش': {
        'شـ (غیرآخر)': { ref: 'شـ', strokes: [ ...SIN_INIT, ...threeDotsUp(360, 158) ]},
        'ش (آخر)': { ref: 'ش', strokes: [ ...SIN_FINAL, ...threeDotsUp(380, 158) ]}
    },
    'ص': {
        'صـ (غیرآخر)': { ref: 'صـ', strokes: SAD_INIT },
        'ص (آخر)': { ref: 'ص', strokes: SAD_FINAL }
    },
    'ض': {
        'ضـ (غیرآخر)': { ref: 'ضـ', strokes: [ ...SAD_INIT, dot(370, 155) ]},
        'ض (آخر)': { ref: 'ض', strokes: [ ...SAD_FINAL, dot(385, 155) ]}
    },
    'ط': { 'ط': { ref: 'ط', strokes: TA_BODY } },
    'ظ': { 'ظ': { ref: 'ظ', strokes: [ ...TA_BODY, dot(375, 152) ] } },
    'ع': {
        'عـ (اول)': { ref: 'عـ', strokes: [ AYN_INIT ]},
        'ـعـ (وسط)': { ref: 'ـعـ', strokes: [ AYN_MED ]},
        'ـع (آخر چسبان)': { ref: 'ـع', strokes: [ AYN_FIN_CONN ]},
        'ع (آخر تنها)': { ref: 'ع', strokes: [ AYN_ISO ]}
    },
    'غ': {
        'غـ (اول)': { ref: 'غـ', strokes: [ AYN_INIT, dot(315, 132) ]},
        'ـغـ (وسط)': { ref: 'ـغـ', strokes: [ AYN_MED, dot(320, 132) ]},
        'ـغ (آخر چسبان)': { ref: 'ـغ', strokes: [ AYN_FIN_CONN, dot(320, 132) ]},
        'غ (آخر تنها)': { ref: 'غ', strokes: [ AYN_ISO, dot(315, 126) ]}
    },

let currentMainChar = 'آ / ا';
let currentFormKey = 'آ (اول)';
let currentStep = 0;
let speedMultiplier = 1;
let showHalfLine = true;
let animFrameId = null;
let autoPlayTimeout = null;

const alphabetGrid = document.getElementById('alphabetGrid');
const formsBar = document.getElementById('formsBar');
const ghostGroup = document.getElementById('ghostGroup');
const drawGroup = document.getElementById('drawGroup');
const pencil = document.getElementById('pencil');
const startDot = document.getElementById('startDot');
const startArrow = document.getElementById('startArrow');
const statusText = document.getElementById('statusText');
const vowelBox = document.getElementById('vowelBox');
const refCharDisplay = document.getElementById('refCharDisplay');
const halfLineGroup = document.getElementById('halfLineGroup');

function initAlphabetGrid() {
    Object.keys(ALPHABET).forEach(charKey => {
        const btn = document.createElement('button');
        btn.className = 'char-btn' + (charKey === currentMainChar ? ' active' : '');
        btn.innerText = charKey;
        btn.onclick = () => selectMainChar(charKey, btn);
        alphabetGrid.appendChild(btn);
    });
}

function selectMainChar(charKey, btnElement) {
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    
    currentMainChar = charKey;
    const forms = ALPHABET[charKey];
    const formKeys = Object.keys(forms);
    
    formsBar.innerHTML = '';
    formKeys.forEach((fKey, idx) => {
        const fBtn = document.createElement('button');
        fBtn.className = 'form-btn' + (idx === 0 ? ' active' : '');
        fBtn.innerText = fKey;
        fBtn.onclick = () => selectForm(fKey, fBtn);
        formsBar.appendChild(fBtn);
    });

    selectForm(formKeys[0], formsBar.firstChild);
}

function selectForm(formKey, btnElement) {
    document.querySelectorAll('.form-btn').forEach(b => b.classList.remove('active'));
    if(btnElement) btnElement.classList.add('active');

    currentFormKey = formKey;
    setupCanvas();
}

function setupCanvas() {
    stopAllAnimations();
    ghostGroup.innerHTML = '';
    drawGroup.innerHTML = '';
    currentStep = 0;

    const formObj = ALPHABET[currentMainChar][currentFormKey];
    const strokes = formObj.strokes;
    refCharDisplay.innerText = formObj.ref;
    vowelBox.style.display = strokes[0].showBox ? 'block' : 'none';

    strokes.forEach((sData, idx) => {
        const ghost = document.createElementNS("http://www.w3.org/2000/svg", "path");
        ghost.setAttribute("d", sData.path);
        ghost.setAttribute("class", "ghost-path");
        if (sData.isDot) ghost.style.strokeWidth = "19px";
        if (sData.thin) ghost.style.strokeWidth = "11px";
        ghostGroup.appendChild(ghost);

        const draw = document.createElementNS("http://www.w3.org/2000/svg", "path");
        draw.setAttribute("d", sData.path);
        let classes = "draw-path";
        if (sData.sec) classes += " secondary";
        if (sData.thin) classes += " thin-sign";
        if (sData.isDot) classes += " dot-stroke";
        draw.setAttribute("class", classes);
        draw.id = "stroke-" + idx;
        drawGroup.appendChild(draw);

        const len = draw.getTotalLength();
        draw.style.strokeDasharray = len + 5;
        draw.style.strokeDashoffset = len + 5;
    });

    showStartPoint(0);
    statusText.innerText = `آماده برای نوشتن « ${currentFormKey} »`;
}

function showStartPoint(strokeIndex) {
    const pathEl = document.getElementById("stroke-" + strokeIndex);
    const strokes = ALPHABET[currentMainChar][currentFormKey].strokes;
    if (!pathEl) {
        startDot.style.display = 'none';
        startArrow.style.display = 'none';
        return;
    }
    const startPt = pathEl.getPointAtLength(0);
    startDot.setAttribute("cx", startPt.x);
    startDot.setAttribute("cy", startPt.y);
    startDot.style.display = 'block';

    if (!strokes[strokeIndex].isDot && pathEl.getTotalLength() > 18) {
        const nextPt = pathEl.getPointAtLength(16);
        const dx = nextPt.x - startPt.x;
        const dy = nextPt.y - startPt.y;
        const angle = Math.atan2(dy, dx);
        const offsetX = -Math.sin(angle) * 20;
        const offsetY = Math.cos(angle) * 20;
        const x1 = startPt.x + offsetX;
        const y1 = startPt.y + offsetY;
        const x2 = x1 + Math.cos(angle) * 24;
        const y2 = y1 + Math.sin(angle) * 24;

        startArrow.setAttribute("x1", x1);
        startArrow.setAttribute("y1", y1);
        startArrow.setAttribute("x2", x2);
        startArrow.setAttribute("y2", y2);
        startArrow.style.display = 'block';
    } else {
        startArrow.style.display = 'none';
    }
}

function animateStroke(index, onComplete) {
    const strokes = ALPHABET[currentMainChar][currentFormKey].strokes;
    if (index >= strokes.length) return;

    const pathEl = document.getElementById("stroke-" + index);
    const totalLength = pathEl.getTotalLength();
    const duration = strokes[index].dur * speedMultiplier;
    
    startDot.style.display = 'none';
    startArrow.style.display = 'none';
    pencil.style.display = 'block';
    statusText.innerText = `حرکت ${index + 1} از ${strokes.length}`;

    let startTime = null;

    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        const currentOffset = (totalLength + 5) * (1 - ease);
        pathEl.style.strokeDashoffset = currentOffset;

        const pt = pathEl.getPointAtLength(totalLength * ease);
        pencil.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);

        if (progress < 1) {
            animFrameId = requestAnimationFrame(step);
        } else {
            pathEl.style.strokeDashoffset = 0;
            if (onComplete) onComplete();
        }
    }

    animFrameId = requestAnimationFrame(step);
}

function playNextStep() {
    stopAllAnimations();
    const strokes = ALPHABET[currentMainChar][currentFormKey].strokes;

    if (currentStep >= strokes.length) {
        setupCanvas();
        return;
    }

    for(let i = 0; i < currentStep; i++) {
        document.getElementById("stroke-" + i).style.strokeDashoffset = 0;
    }

    animateStroke(currentStep, () => {
        currentStep++;
        if (currentStep < strokes.length) {
            pencil.style.display = 'none';
            showStartPoint(currentStep);
        } else {
            finishSuccess();
        }
    });
}

function playAll() {
    setupCanvas();
    const strokes = ALPHABET[currentMainChar][currentFormKey].strokes;

    function runSequence(idx) {
        if (idx >= strokes.length) {
            finishSuccess();
            return;
        }
        currentStep = idx;
        showStartPoint(idx);
        
        autoPlayTimeout = setTimeout(() => {
            animateStroke(idx, () => {
                autoPlayTimeout = setTimeout(() => {
                    runSequence(idx + 1);
                }, 280 * speedMultiplier);
            });
        }, 380 * speedMultiplier);
    }

    runSequence(0);
}

function finishSuccess() {
    pencil.style.display = 'none';
    startDot.style.display = 'none';
    startArrow.style.display = 'none';
    statusText.innerText = "آفرین! کامل شد 👏🌟";
    playSuccessSound();
}

function resetCanvas() {
    setupCanvas();
    statusText.innerText = "پاک شد! دوباره تمرین کنیم.";
}

function stopAllAnimations() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    if (autoPlayTimeout) clearTimeout(autoPlayTimeout);
    pencil.style.display = 'none';
}

function toggleGuides() {
    showHalfLine = !showHalfLine;
    halfLineGroup.style.display = showHalfLine ? 'block' : 'none';
    document.getElementById('guideBtn').innerText = showHalfLine ? "📏 خط نیم‌خط: روشن" : "📏 خط نیم‌خط: خاموش";
}

function toggleSpeed() {
    const btn = document.getElementById('speedBtn');
    if (speedMultiplier === 1) {
        speedMultiplier = 2.2;
        btn.innerText = "🐇 سرعت: کند (مناسب مشق)";
        btn.style.backgroundColor = "#80deea";
    } else {
        speedMultiplier = 1;
        btn.innerText = "🐢 سرعت: معمولی";
        btn.style.backgroundColor = "#ffca28";
    }
}

function playSuccessSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.12);
            osc.stop(ctx.currentTime + i * 0.12 + 0.3);
        });
    } catch(e) {}
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
        document.exitFullscreen();
    }
}

window.onload = () => {
    initAlphabetGrid();
    selectMainChar('آ / ا', alphabetGrid.firstChild);
};
